name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Unit tests, Kafka Streams topology tests and the Testcontainers integration tests
      # (the runner has Docker, so nothing is skipped here)
      - name: Build and test
        run: |
          ./mvnw -B verify 2>&1 | tee maven.log
          exit ${PIPESTATUS[0]}

      - name: Report errors
        if: failure()
        run: .github/report-errors.sh maven.log

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/target/surefire-reports/"

  # Build the images (race-service as a GraalVM native executable), deploy everything to a throwaway kind cluster,
  # and run a simulated race through it
  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # The native build runs in a Mandrel builder container, so the runner needs no GraalVM
      - name: Build jars and the native race-service
        run: |
          ./mvnw -B package -DskipTests -Dnative -Dquarkus.native.container-build=true 2>&1 | tee maven.log
          exit ${PIPESTATUS[0]}

      - name: Build images
        run: |
          docker build -t splitstream/ingest-service:dev ingest-service
          docker build -f race-service/src/main/docker/Dockerfile.native -t splitstream/race-service:dev race-service

      - uses: helm/kind-action@v1
        with:
          cluster_name: splitstream

      - name: Deploy
        run: |
          kind load docker-image splitstream/ingest-service:dev splitstream/race-service:dev --name splitstream
          kubectl apply -k deploy/k8s/overlays/local
          for workload in statefulset/postgres statefulset/kafka deployment/ingest-service deployment/race-service; do
            kubectl -n splitstream rollout status "$workload" --timeout=5m
          done

      - name: Smoke test
        run: deploy/smoke-test.sh

      - name: Startup times and image sizes
        if: success()
        run: |
          {
            kubectl -n splitstream logs deployment/race-service | grep -o "race-service .* started in [0-9.]*s" || true
            kubectl -n splitstream logs deployment/ingest-service | grep -o "Started .* in [0-9.]* seconds" | head -1 || true
            docker images --format "{{.Repository}}:{{.Tag}}  {{.Size}}" | grep splitstream
            kubectl -n splitstream top pods 2> /dev/null || true
          } > numbers.txt
          { echo '```'; cat numbers.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Startup and images::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' numbers.txt)"

      - name: Report build errors
        if: failure()
        run: .github/report-errors.sh maven.log

      - name: Cluster state
        if: failure()
        run: |
          kubectl -n splitstream get all > /dev/null 2>&1 || exit 0
          kubectl -n splitstream get all
          kubectl -n splitstream describe pods
          for app in ingest-service race-service kafka postgres; do
            echo "::group::$app logs"
            kubectl -n splitstream logs -l app.kubernetes.io/name=$app --tail=200 --all-containers || true
            echo "::endgroup::"
          done
          # The same in brief as annotations, readable on the summary page
          for app in ingest-service race-service; do
            {
              kubectl -n splitstream get pods -l app.kubernetes.io/name=$app
              kubectl -n splitstream logs -l app.kubernetes.io/name=$app --tail=25 --all-containers 2>&1 | grep -v "^\s*at " || true
            } > "$app.txt"
            echo "::error title=$app::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$app.txt")"
          done
