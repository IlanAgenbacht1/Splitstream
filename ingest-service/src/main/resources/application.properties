spring.application.name=ingest-service

spring.datasource.url=jdbc:postgresql://localhost:5432/splitstream
spring.datasource.username=splitstream
spring.datasource.password=splitstream
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.mvc.problemdetails.enabled=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.linger.ms=5
# The contract is plain JSON. race-service is Quarkus and has no use for Java type headers.
spring.kafka.producer.properties.spring.json.add.type.headers=false

splitstream.topics.pings=runner-pings
splitstream.topics.races=races

management.endpoints.web.exposure.include=health,info

splitstream.ai.model=claude-opus-5-5
