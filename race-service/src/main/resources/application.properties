quarkus.application.name=race-service
quarkus.http.port=8081

splitstream.topics.pings=runner-pings
splitstream.topics.races=races

quarkus.kafka-streams.bootstrap-servers=localhost:9092
quarkus.kafka-streams.application-id=race-service
# Don't start processing until ingest-service has created both topics
quarkus.kafka-streams.topics=${splitstream.topics.pings},${splitstream.topics.races}
# Leaderboard freshness vs. changelog write volume: commit (and flush the cache) every second
kafka-streams.commit.interval.ms=1000
kafka-streams.statestore.cache.max.bytes=1048576

# Local Kafka comes from docker-compose, not Quarkus Dev Services
quarkus.kafka.devservices.enabled=false
