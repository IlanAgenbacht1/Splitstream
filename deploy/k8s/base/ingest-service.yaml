apiVersion: v1
kind: Service
metadata:
  name: ingest-service
spec:
  selector:
    app.kubernetes.io/name: ingest-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-service
spec:
  # Stateless: any replica can take any request. Flyway's lock table keeps two replicas from migrating at once
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ingest-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingest-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: ingest-service
          image: splitstream/ingest-service
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/splitstream
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            # Only POST /api/run-notes needs it. The client is created lazily, so the app starts without it
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic
                  key: api-key
                  optional: true
            # Size the heap from the container limit, not the node's memory
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75
          # Generous for a cold JVM; liveness and readiness only start once this passes
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Tomcat's work directory, the only place the app writes
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
